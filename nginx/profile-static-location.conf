# 放入 zhiye.sxgkzh.cn 的 server {} 中，并且放在通用图片正则 location 之前。
# 动态奖品二维码必须先代理到 Spring 接口，不能按静态文件映射。
location ^~ /prod-api/profile/lottery/qr/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8080/profile/lottery/qr/;
}

# 兼容 Web 后台历史图片地址 /prod-api/profile/upload/...，避免被图片正则拦截为 404。
location ^~ /prod-api/profile/ {
    alias /www/wwwroot/gkzh/web/imgs/;
    expires 30d;
    access_log off;
}
